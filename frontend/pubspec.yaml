name: shopho
description: Ship hộ trong khu căn hộ
publish_to: none
version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP & WebSocket
  dio: ^5.4.3
  web_socket_channel: ^3.0.3

  # Storage / Auth
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # UI
  go_router: ^13.2.1
  image_picker: ^1.1.1
  cached_network_image: ^3.3.1
  timeago: ^3.6.1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Communication
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.0
  flutter_callkit_incoming: ^2.5.8
  permission_handler: ^11.0.1
  livekit_client: ^2.3.5

  package_info_plus: ^8.0.0
  saver_gallery: ^3.0.7

  # Utils
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^3.0.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - logo.png
